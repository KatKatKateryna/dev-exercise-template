server:
    bind:
        host: 0.0.0.0
        port: 80
    url: ${PHOST}
    mimetype: application/json; charset=UTF-8
    encoding: utf-8
    language: en-US
    cors: true
    pretty_print: true
    limits:
        max_items: 100
    # templates: /path/to/templates
    map:
      url: https://tile.openstreetmap.org/{z}/{x}/{y}.png
      attribution: 'Map data &copy; <a href="https://openstreetmap.org/copyright">OpenStreetMap contributors</a>'
    ogc_schemas_location: /schemas.opengis.net

logging:
    level: ERROR
    #logfile: /tmp/pygeoapi.log

metadata:
    identification:
        title: OGC API Instance
        description: pygeoapi instance in support of the OGC APIs for Data Publishers Training Course
        keywords:
            - geospatial
            - data
            - api
        keywords_type: theme
        terms_of_service: https://creativecommons.org/licenses/by/4.0/
        url: https://github.com/ogcincubator/dev-exercise-template
    license:
        name: CC-BY 4.0 license
        url: https://creativecommons.org/licenses/by/4.0/
    provider:
        name: National Mapping and Cadastral Agency
        url: https://fictional.mappingagency.com
    contact:
        name: Annabel Mwangi
        position: Geospatial Analyst
        address: Mailing Address
        city: City
        stateorprovince: Administrative Area
        postalcode: Zip or Postal Code
        country: Country
        phone: +xx-xxx-xxx-xxxx
        fax: +xx-xxx-xxx-xxxx
        email: annabel@fictional.mappingagency.com
        url: https://fictional.mappingagency.com
        hours: Mo-Fr 08:00-17:00
        instructions: During hours of service. Off on weekends.
        role: pointOfContact

resources:
    watersheds:
        type: collection
        title: Watersheds level 6
        description: Polygon geometry for watersheds at level 6.
        keywords: []
        crs:
            - CRS84
        extents:
            spatial:
                bbox: [-180,-90,180,90]
                crs: http://www.opengis.net/def/crs/OGC/1.3/CRS84
            temporal:
                begin: null
                end: null 
        providers:              
            -   name: PostgreSQL
                crs:
                    - http://www.opengis.net/def/crs/OGC/1.3/CRS84
                    - http://www.opengis.net/def/crs/EPSG/0/4326
                data:
                    dbname: postgres
                    host: ${DB_HOST}
                    port: 5432
                    user: mom_internal_reader
                    password: ${INTERNAL_READER_PASSWORD}
                    search_path:
                    - public
                geom_field: geom
                id_field: feature_id
                time_field: timestamp
                storage_crs: http://www.opengis.net/def/crs/OGC/1.3/CRS84
                table: view_summary_final_alert
                type: feature
    final_alert_no_geometry:
        type: collection
        title: Final Alert (no geometry)
        description: Alert level per watershed.
        keywords: []
        crs:
            - CRS84
        extents:
            spatial:
                bbox: [-180,-90,180,90]
                crs: http://www.opengis.net/def/crs/OGC/1.3/CRS84
            temporal:
                begin: null
                end: null 
        providers:              
            -   name: PostgreSQL
                crs:
                    - http://www.opengis.net/def/crs/OGC/1.3/CRS84
                    - http://www.opengis.net/def/crs/EPSG/0/4326
                data:
                    dbname: postgres
                    host: ${DB_HOST}
                    port: 5432
                    user: mom_internal_reader
                    password: ${INTERNAL_READER_PASSWORD}
                    search_path:
                    - public
                id_field: feature_id
                time_field: timestamp
                storage_crs: http://www.opengis.net/def/crs/OGC/1.3/CRS84
                table: view_summary_final_alert
                type: feature
    final_alert:
        type: collection
        title: Final Alert with geometry
        description: Alert level per watershed.
        keywords: []
