server:
    bind:
        host: 0.0.0.0
        port: 80
    url: ${PHOST}
    mimetype: application/json; charset=UTF-8
    encoding: utf-8
    language: en-US
    cors: true
    pretty_print: true
    limits:
        max_items: 100
    # templates: /path/to/templates
    map:
      url: https://tile.openstreetmap.org/{z}/{x}/{y}.png
      attribution: 'Map data &copy; <a href="https://openstreetmap.org/copyright">OpenStreetMap contributors</a>'
    ogc_schemas_location: /schemas.opengis.net

logging:
    level: ERROR
    #logfile: /tmp/pygeoapi.log

metadata:
    identification:
        title: OGC API Instance
        description: pygeoapi instance in support of the OGC APIs for Data Publishers Training Course
        keywords:
            - geospatial
            - data
            - api
        keywords_type: theme
        terms_of_service: https://creativecommons.org/licenses/by/4.0/
        url: https://github.com/ogcincubator/dev-exercise-template
    license:
        name: CC-BY 4.0 license
        url: https://creativecommons.org/licenses/by/4.0/
    provider:
        name: National Mapping and Cadastral Agency
        url: https://fictional.mappingagency.com
    contact:
        name: Annabel Mwangi
        position: Geospatial Analyst
        address: Mailing Address
        city: City
        stateorprovince: Administrative Area
        postalcode: Zip or Postal Code
        country: Country
        phone: +xx-xxx-xxx-xxxx
        fax: +xx-xxx-xxx-xxxx
        email: annabel@fictional.mappingagency.com
        url: https://fictional.mappingagency.com
        hours: Mo-Fr 08:00-17:00
        instructions: During hours of service. Off on weekends.
        role: pointOfContact

resources:
    coimbra_autonomous_vehicle_gps_points:
        type: collection
        title: Coimbra_autonomous_vehicle_gps_points
        description: The LIPD Dataset was collected in the Coimbra Univeristy/ISR Campus zone.
        keywords: []
        crs:
            - CRS84
        links:
            - type: text/html
              rel: download
              title: "Laser and Image Pedestrian Detection Dataset in Urban Environment (LIPD dataset)"
              href: https://home.deec.uc.pt/~cpremebida/dataset.html
              hreflang: en-US
        extents:
            spatial:
                bbox: [-8.424,40.19,-8.41,40.19]
                crs: http://www.opengis.net/def/crs/OGC/1.3/CRS84
            temporal:
                begin: null
                end: null 
        providers:
            - type: feature
              name: GeoJSON
              data: /data/Coimbra_autonomous_vehicle_gps_points.geojson
              id_field: id
